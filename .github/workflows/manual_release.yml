name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 2.2.0)'
        required: true
        type: string
      version_code:
        description: 'Version code (e.g., 70)'
        required: true
        type: string

env:
  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
  # 源码中的 Gradle 脚本读取的是 ALIAS 环境变量，此处将 Secret 中的 KEY_ALIAS 映射过去
  ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}

jobs:
  build_and_release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: oracle
          cache: 'gradle'


      - name: Detect Keystore Type
        run: |
          MAGIC=$(od -An -tx1 -N4 app/keystore/main.jks | tr -d ' \n')
          if [ "$MAGIC" = "feedfeed" ]; then
            echo "KEY_STORE_TYPE=JKS" >> "$GITHUB_ENV"
          else
            echo "KEY_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: bash ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}-${{ inputs.version_code }}
          name: ${{ inputs.version_name }}
          files: app/build/outputs/apk/release/LogFox-*.apk
          generate_release_notes: true
