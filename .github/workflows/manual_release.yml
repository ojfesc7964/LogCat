name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., 2.2.0)'
        required: true
        type: string
      version_code:
        description: 'Version code (e.g., 70)'
        required: true
        type: string

env:
  # 此处引用的名称必须与 GitHub Repository Secrets 中创建的完全一致
  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
  ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}

jobs:
  build_and_release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: oracle
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/main.jks

      - name: Detect Keystore Type
        run: |
          # 读取 Keystore 文件头部的魔数，避免 Java 21 默认使用 PKCS12 解析 JKS 导致报错
          MAGIC=$(od -An -tx1 -N4 app/keystore/main.jks | tr -d ' \n')
          if [ "$MAGIC" = "feedfeed" ]; then
            echo "KEY_STORE_TYPE=JKS" >> "$GITHUB_ENV"
          else
            echo "KEY_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: bash ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER verify --verbose "$APK_PATH" || { echo "APK is NOT properly signed!"; exit 1; }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}-${{ inputs.version_code }}
          name: ${{ inputs.version_name }}
          files: app/build/outputs/apk/release/LogFox-*.apk
          generate_release_notes: true
